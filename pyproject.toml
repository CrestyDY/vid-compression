[project]
name = "vid-compression"
version = "0.1.0"
description = "An experimental video codec built from scratch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.13.5",
    "zstandard>=0.22",
]

[project.scripts]
vidc = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors src/, so tests/utils/ and tests/modes/ need conftest importable by name
# from a subdirectory.
pythonpath = ["tests"]
markers = [
    "samples: round-trips real footage from samples/; skipped when the folder is empty",
]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# conftest is the tests' own shared-fixture module, not a third-party package.
known-first-party = ["src", "conftest"]
